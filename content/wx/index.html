<p>Below is the live-updating interactive temperature log for College Park, MD, pulling directly from NOAA's climatology servers:</p>

<script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
<div id="acis-weather-chart" style="width:100%; height:500px; margin:20px auto;"></div>

<script>
    const acisUrl = 'https://data.rcc-acis.org/StnData';
    const queryParams = {
        sid: 'USW00093751', 
        sdate: '2026-01-01',
        edate: '2026-12-31',
        elems: [{ name: 'maxt', vtype: 'val' }, { name: 'mint', vtype: 'val' }]
    };

    fetch(acisUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(queryParams)
    })
    .then(res => res.json())
    .then(payload => {
        const rawData = payload.data;
        const dates = [], highs = [], lows = [];
        rawData.forEach(row => {
            if (row[1] !== 'M' && row[2] !== 'M') {
                dates.push(row[0]);
                highs.push(parseFloat(row[1]));
                lows.push(parseFloat(row[2]));
            }
        });

        Plotly.newPlot('acis-weather-chart', [
            { x: dates, y: highs, mode: 'lines', name: 'Daily High', line: { color: '#dc2626' }},
            { x: dates, y: lows, mode: 'lines', name: 'Daily Low', line: { color: '#2563eb' }}
        ], {
            title: '2026 Observed High & Low Temperatures — College Park, MD',
            xaxis: { type: 'date' },
            yaxis: { title: 'Temperature (°F)' },
            hovermode: 'x unified',
            template: 'plotly_white'
        }, {responsive: true});
    });
</script>
